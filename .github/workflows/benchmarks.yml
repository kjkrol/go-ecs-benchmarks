name: Benchmarks

on:
  push:
    branches:
    - main
    paths:
    - 'bench/**'
    - 'go.mod'
    - 'go.sum'
  pull_request:
    paths:
    - 'bench/**'
    - 'go.mod'
    - 'go.sum'
  workflow_dispatch: {}

jobs:
  benchmarks_fast_1:
    name: Fast benchmarks 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=1s -count=3 \
              query2comp \
              query32arch \
              query256arch \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_fast_1
          path: results/*
          
  benchmarks_fast_2:
    name: Fast benchmarks 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=1s -count=3 \
              random \
              add_remove \
              add_remove_large \
              new_world

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_fast_2
          path: results/*

  benchmarks_slow_1:
    name: Slow benchmarks 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=0.1s \
              create2comp \
              create2comp_alloc \
              create10comp \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_slow_1
          path: results/*
          
  benchmarks_slow_2:
    name: Slow benchmarks 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=0.1s \
              delete2comp \
              delete10comp \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_slow_2
          path: results/*
          
  plots:
    name: Plot benchmarks
    runs-on: ubuntu-latest
    needs:
      - benchmarks_fast_1
      - benchmarks_fast_2
      - benchmarks_slow_1
      - benchmarks_slow_2
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          pip install -r ./plot/requirements.txt

      - name: Download results_fast_1
        uses: actions/download-artifact@v4
        with:
          name: results_fast_1
          path: results
      - name: Download results_fast_2
        uses: actions/download-artifact@v4
        with:
          name: results_fast_2
          path: results
      - name: Download results_slow_1
        uses: actions/download-artifact@v4
        with:
          name: results_slow_1
          path: results
      - name: Download results_slow_2
        uses: actions/download-artifact@v4
        with:
          name: results_slow_2
          path: results

      - name: Plot results
        run: |
          python plot/plot.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results

  publish:
    name: Publish results
    runs-on: ubuntu-latest
    needs:
      - plots
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v3

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: results
          path: results

      - name: Copy results into tracked paths
        run: |
          mkdir -p docs/results
          cp results/*.svg results/*.png docs/results/
          cp results/README.md README.md

      - name: Open or update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bench-results-update
          commit-message: "Update benchmark results"
          title: "Update benchmark results"
          body: |
            Auto-generated by the `publish` job in `benchmarks.yml` after a benchmark run on `main`.
            Only `README.md` and `docs/results/**` change — no benchmark code. Safe to merge once the
            numbers/plots look right; this branch is force-pushed on every run, so this PR is reused
            rather than duplicated.
          delete-branch: false
