name: Benchmarks

on:
  push:
    branches:
    - main
    paths:
    - 'bench/**'
    - 'go.mod'
    - 'go.sum'
    - 'docs/README-template.md'
  pull_request:
    paths:
    - 'bench/**'
    - 'go.mod'
    - 'go.sum'
    - 'docs/README-template.md'
  workflow_dispatch: {}

jobs:
  benchmarks_fast_1:
    name: Fast benchmarks 1
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=1s -count=3 \
              query2comp \
              query32arch \
              query256arch \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_fast_1
          path: results/*
          
  benchmarks_fast_2:
    name: Fast benchmarks 2
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=1s -count=3 \
              random \
              add_remove \
              add_remove_large \
              new_world

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_fast_2
          path: results/*

  benchmarks_slow_1:
    name: Slow benchmarks 1
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=0.1s \
              create2comp \
              create2comp_alloc \
              create10comp \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_slow_1
          path: results/*
          
  benchmarks_slow_2:
    name: Slow benchmarks 2
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v3
      - uses: ./.github/actions/setup-go
      - name: Run benchmarks
        run: |
          go run . -test.benchtime=0.1s \
              delete2comp \
              delete10comp \

      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results_slow_2
          path: results/*
          
  plots:
    name: Plot benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs:
      - benchmarks_fast_1
      - benchmarks_fast_2
      - benchmarks_slow_1
      - benchmarks_slow_2
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          pip install -r ./plot/requirements.txt

      - name: Download results_fast_1
        uses: actions/download-artifact@v4
        with:
          name: results_fast_1
          path: results
      - name: Download results_fast_2
        uses: actions/download-artifact@v4
        with:
          name: results_fast_2
          path: results
      - name: Download results_slow_1
        uses: actions/download-artifact@v4
        with:
          name: results_slow_1
          path: results
      - name: Download results_slow_2
        uses: actions/download-artifact@v4
        with:
          name: results_slow_2
          path: results

      - name: Plot results
        run: |
          python plot/plot.py
      - name: Archive results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: results

  # find-pr-run locates the pull_request run whose benchmarks are still
  # valid for this push — the merge (or squash/rebase) commit's own tree is
  # identical to what that PR run already measured, so publish reuses that
  # run's results instead of recomputing (fast_1/2, slow_1/2, plots all skip
  # on push — see their `if:`). Outputs an empty run_id when this push has no
  # associated PR (e.g. a direct push to main); publish then does nothing.
  find-pr-run:
    name: Find PR benchmark run
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    permissions:
      actions: read
      pull-requests: read
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          PR_SHA=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].head.sha // empty')
          if [ -z "$PR_SHA" ]; then
            echo "No PR associated with $SHA — nothing to reuse."
            echo "run_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID=$(gh run list --repo "$REPO" --workflow=benchmarks.yml --limit 50 \
            --json databaseId,conclusion,event,headSha \
            --jq "[.[] | select(.headSha == \"$PR_SHA\" and .event == \"pull_request\" and .conclusion == \"success\")][0].databaseId // empty")
          if [ -z "$RUN_ID" ]; then
            echo "No successful pull_request run found for $PR_SHA."
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish results
    runs-on: ubuntu-latest
    needs:
      - find-pr-run
    if: needs.find-pr-run.outputs.run_id != ''
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v3

      - name: Download results from the PR's benchmark run
        uses: actions/download-artifact@v4
        with:
          name: results
          path: results
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.find-pr-run.outputs.run_id }}

      - name: Copy results into tracked paths
        run: |
          mkdir -p docs/results
          cp results/*.svg results/*.png docs/results/
          cp results/README.md README.md

      - name: Open or update results PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bench-results-update
          commit-message: "Update benchmark results"
          title: "Update benchmark results"
          body: |
            Auto-generated by the `publish` job in `benchmarks.yml` after a benchmark run on `main`.
            Only `README.md` and `docs/results/**` change — no benchmark code. Safe to merge once the
            numbers/plots look right; this branch is force-pushed on every run, so this PR is reused
            rather than duplicated.
          delete-branch: false
